{% for ep in endpoints %}
<a href="{{ url_for('endpoints.detail', endpoint_id=ep.id) }}" class="endpoint-card">
  <div class="flex items-center justify-between mb-2">
    <span class="text-xs font-semibold text-ink-100 truncate font-mono-data">{{ ep.hostname }}</span>
    <span class="status-dot status-dot-{{ ep.status }} flex-shrink-0 ml-1.5"></span>
  </div>
  <div class="text-xs text-ink-500 mb-2 truncate">{{ ep.branch_name or '—' }}</div>
  <div class="flex gap-2">
    <div class="flex-1">
      <div class="text-xs text-ink-700 mb-0.5">CPU</div>
      <div class="metric-bar-track"><div id="cpu-bar-{{ ep.id }}" class="metric-bar-fill {{ 'metric-bar-high' if (ep.cpu_pct or 0) >= 90 else 'metric-bar-mid' if (ep.cpu_pct or 0) >= 70 else 'metric-bar-low' }}"></div></div>
    </div>
    <div class="flex-1">
      <div class="text-xs text-ink-700 mb-0.5">RAM</div>
      <div class="metric-bar-track"><div id="ram-bar-{{ ep.id }}" class="metric-bar-fill {{ 'metric-bar-high' if (ep.ram_used_pct or 0) >= 90 else 'metric-bar-mid' if (ep.ram_used_pct or 0) >= 70 else 'metric-bar-low' }}"></div></div>
    </div>
  </div>
  <div class="text-xs text-ink-700 mt-1.5">{{ ep.last_seen_ago or 'Never' }}</div>
  <style nonce="{{ csp_nonce }}">
    #cpu-bar-{{ ep.id }} { width: {{ ep.cpu_pct or 0 }}%; }
    #ram-bar-{{ ep.id }} { width: {{ ep.ram_used_pct or 0 }}%; }
  </style>
</a>
{% else %}
<div class="col-span-3 empty-state py-8">
  <p class="text-sm text-ink-700">No endpoints enrolled</p>
</div>
{% endfor %}
