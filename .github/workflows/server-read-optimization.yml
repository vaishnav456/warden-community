name: Server read optimization regression

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: read_optimization
          POSTGRES_PASSWORD: isolated-test-only
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d read_optimization"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check aggregate scope, permissions, UTC boundaries and migration idempotency
        env:
          TEST_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$TEST_DB_CONTAINER" psql -U postgres -d read_optimization -v ON_ERROR_STOP=1 < server/tests/server_read_optimization_fixture.sql
          docker exec -i "$TEST_DB_CONTAINER" psql -U postgres -d read_optimization -v ON_ERROR_STOP=1 < migrations/2026-10-04-server-read-optimization.sql
          docker exec -i "$TEST_DB_CONTAINER" psql -U postgres -d read_optimization -v ON_ERROR_STOP=1 < migrations/2026-10-04-server-read-optimization.sql
          docker exec -i "$TEST_DB_CONTAINER" psql -U postgres -d read_optimization -v ON_ERROR_STOP=1 < server/tests/server_read_optimization_assertions.sql
          docker exec -i "$TEST_DB_CONTAINER" psql -U postgres -d read_optimization -v ON_ERROR_STOP=1 < server/tests/server_read_optimization_dst.sql
