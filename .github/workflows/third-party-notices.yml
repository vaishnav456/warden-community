name: Third party notice coverage

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check declared dependency and notice coverage
        run: python3 tools/check_third_party.py
      - name: Verify notice packaging contracts
        run: python3 -m unittest discover -s build-service -p 'test_notice*.py'
