name: Trusted admin

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  admin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r trusted-admin/requirements.txt
      - run: python -m unittest discover -s trusted-admin/tests -v
      - run: python tools/check_third_party.py
  admin-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-admin-test-only
          POSTGRES_DB: warden_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warden_admin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WARDEN_ADMIN_TEST_DSN: postgresql://postgres:isolated-admin-test-only@127.0.0.1:5432/warden_admin_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r trusted-admin/requirements.txt
      - run: python -m unittest discover -s trusted-admin/tests -v
