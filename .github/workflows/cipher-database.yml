name: Ciphertext database
on:
  pull_request:
  push:
    branches: [main, master, develop]
permissions:
  contents: read
jobs:
  encrypted-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-cipher-test-only
          POSTGRES_DB: warden_cipher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warden_cipher_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WARDEN_CIPHER_TEST_DSN: postgresql://postgres:isolated-cipher-test-only@127.0.0.1:5432/warden_cipher_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned runtime without package scripts
        working-directory: cipher-db
        run: npm ci --ignore-scripts
      - name: Remote frame ordering, bounds and resynchronization
        run: node --test server/tests/remote_frame_queue.test.mjs
      - name: Encryption, atomicity, restart, tamper and actual storage-interface checks
        working-directory: cipher-db
        run: npm test
      - name: Build trusted concurrent runtime
        run: docker build -f cipher-db/Dockerfile -t warden-cipher-native-test .
      - name: Concurrent reads, grouped durability, recovery and volatile-only projection
        run: >-
          docker run --rm --init --network host --read-only --memory 4g --memory-swap 4g --ulimit core=0
          --tmpfs /tmp:size=32m,mode=1777
          --tmpfs /run/warden-projection:size=3g,mode=0700,uid=10005,gid=10001
          --tmpfs /var/lib/postgresql/data:size=1m,mode=0700,uid=10005,gid=10001
          --mount type=bind,source=${{ github.workspace }}/cipher-db/tests,target=/app/tests,readonly
          --mount type=bind,source=${{ github.workspace }}/db-init,target=/db-init,readonly
          -e WARDEN_NATIVE_TEST=1 -e WARDEN_CIPHER_TEST_DSN warden-cipher-native-test
          node --test --test-isolation=none tests/native.test.mjs tests/postgres.test.mjs tests/rest.test.mjs tests/replay.test.mjs
