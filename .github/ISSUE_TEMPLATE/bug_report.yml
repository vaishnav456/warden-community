name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities or expose tenant data here. Follow SECURITY.md for private reporting."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server or web console
        - Windows agent
        - Linux or macOS agent
        - Warden Home Node
        - Windows Credential Provider
        - Build or deployment
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Remove credentials, tenant identifiers, IP addresses, and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
